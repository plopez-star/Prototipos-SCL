<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Bolsa Laboral · Santa Catalina Labouré</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--ac:#f5a623;--acd:#b86e00;--tl:#3aa982;--tld:#0d7c73;--bg:#f2f4f7;--card:#fff;--tx:#3a4250;--hd:#1f2632;--mu:#6f7786;--bd:#e3e6eb;--hv:#f7f8fa;--nav:#4a525f;--navt:#cfd4db;--ok:#23804a;--okb:#e6f5ec;--no:#c43b3b;--nob:#fcebea;--pe:#9a6200;--peb:#fdf3e1;--in:#2b63c4;--inb:#e8effc;--mub:#eceef2;--sh:0 1px 2px rgba(20,30,50,.06);
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#151a21;--card:#1e252e;--tx:#d6dbe2;--hd:#f1f3f6;--mu:#97a0ad;--bd:#2f3843;--hv:#252d37;--nav:#2a313b;--okb:#163626;--ok:#6fd49a;--nob:#3a1d1d;--no:#f08a8a;--peb:#3a2c12;--pe:#f3c26b;--inb:#1b2a44;--in:#8fb3f5;--mub:#2a313b;--acd:#f5b84a;--tld:#4fd1c5;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#151a21;--card:#1e252e;--tx:#d6dbe2;--hd:#f1f3f6;--mu:#97a0ad;--bd:#2f3843;--hv:#252d37;--nav:#2a313b;--okb:#163626;--ok:#6fd49a;--nob:#3a1d1d;--no:#f08a8a;--peb:#3a2c12;--pe:#f3c26b;--inb:#1b2a44;--in:#8fb3f5;--mub:#2a313b;--acd:#f5b84a;--tld:#4fd1c5;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box;margin:0;padding:0}
body{font:14px/1.55 Poppins,'Segoe UI',system-ui,-apple-system,sans-serif;background:var(--bg);color:var(--tx);min-height:100vh}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--card)}
.hidden{display:none!important}
button,input,select,textarea{font:inherit;color:inherit}
svg.i{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none;vertical-align:-3px}
:focus-visible{outline:2px solid var(--ac);outline-offset:2px}
/* ---------- login ---------- */
.auth{min-height:100vh;display:grid;place-items:center;padding:1.5rem 1rem;background:#2f3640}
.auth.emp{background:#123b3a}
.box{background:var(--card);padding:2rem 2rem 1.6rem;border-radius:10px;width:100%;max-width:420px;box-shadow:0 24px 48px rgba(0,0,0,.35)}
.box .logo{display:flex;justify-content:center;margin-bottom:.4rem}
.box h1{font-size:1.15rem;font-weight:600;text-align:center;color:var(--hd)}
.box .sub{text-align:center;color:var(--mu);font-size:.85rem;margin-bottom:.6rem}
label{display:block;font-size:.78rem;font-weight:500;margin:.85rem 0 .3rem;color:var(--mu)}
input,select,textarea{width:100%;padding:.5rem .7rem;border:1px solid var(--bd);border-radius:6px;background:var(--card);font-size:.88rem}
input:disabled{background:var(--hv);color:var(--mu)}
textarea{resize:vertical}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:.4rem;padding:.5rem 1rem;border:0;border-radius:6px;background:var(--ac);color:#2a1a00;font-weight:500;cursor:pointer;font-size:.86rem;white-space:nowrap}
.btn:hover{filter:brightness(.95)}
.btn.w{width:100%;margin-top:1.2rem;padding:.65rem}
.btn.tl{background:var(--tl);color:#fff}
.btn.g{background:transparent;border:1px solid var(--bd);color:var(--tx)}.btn.g:hover{background:var(--hv)}
.btn.sl{background:#6b7584;color:#fff}
.btn.ok{background:var(--ok);color:#fff}.btn.no{background:var(--no);color:#fff}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .btn.ok,:root:not([data-theme="light"]) .btn.no{color:#10161d}}
:root[data-theme="dark"] .btn.ok,:root[data-theme="dark"] .btn.no{color:#10161d}
.btn.sm{padding:.25rem .6rem;font-size:.76rem}
.ib{display:inline-grid;place-items:center;width:30px;height:30px;border-radius:6px;border:1px solid var(--bd);background:var(--card);cursor:pointer;color:var(--mu)}
.ib:hover{color:var(--hd);background:var(--hv)}
.err{color:var(--no);background:var(--nob);padding:.5rem .7rem;border-radius:6px;font-size:.82rem;margin-top:.9rem}
.lk{color:var(--acd);cursor:pointer;background:none;border:0;text-decoration:underline;font-size:.82rem}
.emp .lk{color:var(--tld)}
.foot{text-align:center;margin-top:1rem;display:grid;gap:.35rem}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:0 .9rem}
.g3{display:grid;grid-template-columns:repeat(3,1fr);gap:0 .9rem}
.g4{display:grid;grid-template-columns:repeat(4,1fr);gap:0 .9rem}
@media(max-width:640px){.g2,.g3,.g4{grid-template-columns:1fr}}
/* ---------- app chrome ---------- */
.top{background:var(--card);height:60px;padding:0 1.4rem;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid var(--bd);position:sticky;top:env(safe-area-inset-top,0px);z-index:20}
.brand{display:flex;align-items:center;gap:.55rem;color:var(--hd)}
.brand b{font-size:1.12rem;font-weight:600;letter-spacing:-.01em;line-height:1}
.brand small{display:block;font-size:.55rem;letter-spacing:.12em;color:var(--mu);text-align:right;margin-top:1px}
.ui{display:flex;align-items:center;gap:.9rem}
.av{width:34px;height:34px;border-radius:50%;background:var(--tl);color:#fff;display:grid;place-items:center;font-weight:600;font-size:.85rem}
.uname{font-size:.84rem;color:var(--mu)}
.bell{position:relative}
.bell .dot{position:absolute;top:-4px;right:-5px;background:#e5484d;color:#fff;font-size:.62rem;font-weight:600;min-width:17px;height:17px;border-radius:9px;display:grid;place-items:center;padding:0 4px}
.np{position:absolute;right:0;top:40px;width:340px;max-width:calc(100vw - 2rem);background:var(--card);border:1px solid var(--bd);border-radius:8px;box-shadow:0 12px 30px rgba(0,0,0,.18);z-index:40;overflow:hidden}
.np h4{font-size:.82rem;font-weight:600;padding:.7rem .9rem;border-bottom:1px solid var(--bd);display:flex;justify-content:space-between;color:var(--hd)}
.np ul{list-style:none;max-height:360px;overflow:auto}
.np li{display:flex;gap:.6rem;padding:.7rem .9rem;border-bottom:1px solid var(--bd);cursor:pointer;font-size:.8rem}
.np li:hover{background:var(--hv)}.np li.un{background:var(--peb)}
.np li .t{flex:1}.np li .h{color:var(--mu);font-size:.72rem;white-space:nowrap}
.nav{background:var(--nav);padding:0 1.4rem;display:flex;gap:1.6rem;overflow-x:auto;position:sticky;top:calc(60px + env(safe-area-inset-top,0px));z-index:15}
.nav button{display:flex;align-items:center;gap:.4rem;padding:.8rem 0;background:none;border:0;border-bottom:3px solid transparent;color:var(--navt);font-size:.82rem;cursor:pointer;white-space:nowrap}
.nav button:hover{color:#fff}.nav button.on{color:#fff;font-weight:500;border-bottom-color:var(--ac)}
.ph{background:var(--card);border-bottom:1px solid var(--bd);padding:.9rem 1.4rem}
.ph h1{font-size:1.15rem;font-weight:500;color:var(--hd);max-width:1240px;margin:0 auto;display:flex;justify-content:space-between;align-items:center;gap:1rem}
#main{padding:1.4rem;max-width:1240px;margin:0 auto}
/* ---------- dashboard ---------- */
.sec{font-size:.95rem;font-weight:500;color:var(--hd);margin:0 0 .8rem}
.sg{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:1rem;margin-bottom:1.6rem}
.sc{background:var(--card);border:1px solid var(--bd);border-radius:8px;padding:1rem 1.1rem;box-shadow:var(--sh)}
.sc .r1{display:flex;justify-content:space-between;align-items:flex-start}
.sc .n{font-size:1.9rem;font-weight:400;color:var(--hd);line-height:1.1}
.sc .l{font-size:.72rem;color:var(--mu);letter-spacing:.04em;font-weight:500}
.sc .s{font-size:.72rem;color:var(--mu);border-top:1px solid var(--bd);margin-top:.8rem;padding-top:.55rem}
.sc svg.i{width:26px;height:26px;color:var(--ac);stroke-width:1.7}
.card{background:var(--card);border:1px solid var(--bd);border-radius:8px;margin-bottom:1.3rem;box-shadow:var(--sh)}
.ch{padding:.8rem 1.1rem;border-bottom:1px solid var(--bd);display:flex;justify-content:space-between;align-items:center;gap:1rem}
.ch h2{font-size:.92rem;font-weight:500;color:var(--hd)}
.cp{padding:1.1rem}
.lr{display:flex;align-items:center;gap:1rem;padding:.75rem 1.1rem;border-bottom:1px solid var(--bd)}
.lr:last-child{border-bottom:0}
.lg{width:34px;height:26px;border-radius:3px;display:grid;place-items:center;color:#fff;font-size:.68rem;font-weight:600;flex:none}
.lr .tt{flex:1;font-size:.8rem;text-transform:uppercase;color:var(--tx);min-width:0}
.lr .tt small{display:block;text-transform:none;color:var(--mu);font-size:.72rem}
.lr .ac{display:flex;gap:.4rem;align-items:center}
/* ---------- toolbar + tablas ---------- */
.tool{display:flex;gap:.55rem;flex-wrap:wrap;align-items:center;margin-bottom:1rem}
.tool select,.tool input{width:auto;background:#6b7584;color:#fff;border:0;font-size:.8rem;padding:.48rem .7rem}
.tool input::placeholder{color:#e2e6ec}
.tool .q{min-width:170px;flex:0 1 220px}
.tool .sz{background:var(--card);color:var(--tx);border:1px solid var(--bd)}
.tool .dr{display:flex;align-items:center;gap:.35rem;background:#6b7584;color:#fff;border-radius:6px;padding:0 .55rem}
.tool .dr input{padding:.48rem .1rem;background:transparent;width:128px;color-scheme:dark}
.tool .sp{flex:1}
.tool .ib{background:#6b7584;color:#fff;border:0}
.tbw{background:var(--card);border:1px solid var(--bd);border-radius:8px;box-shadow:var(--sh)}
.cb{overflow-x:auto}
table{width:100%;border-collapse:collapse;text-align:left}
th{padding:.75rem .9rem;font-size:.76rem;font-weight:600;color:var(--hd);border-bottom:1px solid var(--bd);white-space:nowrap}
td{padding:.7rem .9rem;font-size:.82rem;border-bottom:1px solid var(--bd);vertical-align:middle}
tbody tr:hover>td{background:var(--hv)}
td.x{width:28px;padding-right:0}
.xp{background:none;border:0;cursor:pointer;color:var(--mu);display:grid;place-items:center}
.xp svg{transition:transform .15s}.xp.on svg{transform:rotate(90deg)}
tr.dt>td{background:var(--hv);padding:1rem 1.2rem 1.1rem 2.6rem}
tr.dt:hover>td{background:var(--hv)}
.kv{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:.6rem 1.4rem;font-size:.8rem}
.kv span{display:block;color:var(--mu);font-size:.72rem}
.em{text-align:center;color:var(--mu);padding:1.6rem}
.nw{white-space:nowrap}.mu{color:var(--mu);font-size:.76rem}.trunc{max-width:260px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pg{display:flex;justify-content:space-between;align-items:center;padding:.7rem 1rem;font-size:.78rem;color:var(--mu);gap:1rem;flex-wrap:wrap}
.pg div{display:flex;gap:.25rem}
.pg button{min-width:30px;height:30px;border:1px solid var(--bd);background:var(--card);border-radius:4px;cursor:pointer;color:var(--tx)}
.pg button.on{background:var(--nav);color:#fff;border-color:var(--nav)}
.pg button:disabled{opacity:.4;cursor:default}
/* ---------- estados ---------- */
.pill{display:inline-flex;align-items:center;gap:.3rem;font-size:.76rem;font-weight:500;border-radius:5px;padding:.25rem .6rem;border:1px solid transparent;white-space:nowrap}
select.pill{width:auto;padding:.3rem 1.6rem .3rem .6rem;cursor:pointer;appearance:none;-webkit-appearance:none;background-image:linear-gradient(45deg,transparent 50%,currentColor 50%),linear-gradient(135deg,currentColor 50%,transparent 50%);background-position:calc(100% - 12px) 52%,calc(100% - 8px) 52%;background-size:4px 4px;background-repeat:no-repeat}
.pill.pe{color:var(--pe);background-color:var(--peb);border-color:color-mix(in srgb,var(--pe) 35%,transparent)}
.pill.ok{color:var(--ok);background-color:var(--okb);border-color:color-mix(in srgb,var(--ok) 35%,transparent)}
.pill.no{color:var(--no);background-color:var(--nob);border-color:color-mix(in srgb,var(--no) 35%,transparent)}
.pill.in{color:var(--in);background-color:var(--inb);border-color:color-mix(in srgb,var(--in) 35%,transparent)}
.pill.mu{color:var(--mu);background-color:var(--mub);border-color:var(--bd)}
.tag{display:inline-block;font-size:.7rem;padding:.12rem .5rem;border-radius:4px;background:var(--mub);color:var(--mu)}
.prem{display:inline-block;background:var(--ac);color:#2a1a00;font-size:.62rem;font-weight:600;letter-spacing:.06em;padding:.1rem .5rem;border-radius:4px}
/* ---------- configuración ---------- */
.cfg{display:grid;grid-template-columns:300px 1fr;gap:1.3rem;align-items:start}
@media(max-width:860px){.cfg{grid-template-columns:1fr}}
.cfl{text-align:center}
.cfl .lgbox{width:150px;height:84px;margin:0 auto .8rem;display:grid;place-items:center;border-radius:40px;border:1px solid var(--bd);background:#fff;overflow:hidden}
.cfl .lgbox img{max-width:100%;max-height:100%}
.cfl h3{font-size:1rem;font-weight:600;color:var(--hd);text-transform:uppercase;line-height:1.3}
.cfs{display:grid;grid-template-columns:repeat(3,1fr);border-top:1px solid var(--bd);margin-top:1rem}
.cfs div{padding:.8rem .2rem}.cfs b{display:block;font-size:1.2rem;font-weight:500;color:var(--hd)}.cfs span{font-size:.62rem;letter-spacing:.06em;color:var(--acd);font-weight:600}
.tabs{display:flex;gap:1.4rem;border-bottom:1px solid var(--bd);padding:0 1.1rem;overflow-x:auto}
.tabs button{background:none;border:0;padding:.85rem 0;font-size:.82rem;color:var(--mu);border-bottom:2px solid transparent;cursor:pointer;white-space:nowrap}
.tabs button.on{color:var(--hd);border-bottom-color:var(--ac);font-weight:500}
.chips{display:flex;flex-wrap:wrap;gap:.4rem;margin:.5rem 0}
.chip{display:inline-flex;align-items:center;gap:.3rem;padding:.25rem .3rem .25rem .7rem;border-radius:20px;background:var(--hv);border:1px solid var(--bd);font-size:.8rem}
.chip button{background:none;border:0;cursor:pointer;color:var(--mu);display:grid;place-items:center;width:20px;height:20px;border-radius:50%}
.chip button:hover{background:var(--nob);color:var(--no)}
.sw{display:flex;align-items:flex-start;gap:.6rem;margin:.8rem 0;font-size:.84rem;color:var(--tx);cursor:pointer}
.sw input{width:auto;margin-top:.25rem}
.code{font-family:ui-monospace,Menlo,Consolas,monospace;background:var(--hv);border:1px solid var(--bd);border-radius:6px;padding:.55rem .7rem;font-size:.8rem;word-break:break-all}
/* ---------- portal empresa / público ---------- */
.pt{background:var(--card);border-bottom:1px solid var(--bd);display:flex;align-items:center;justify-content:space-between;gap:1rem;padding:.6rem 1.4rem;position:sticky;top:env(safe-area-inset-top,0px);z-index:20;flex-wrap:wrap}
.pt nav{display:flex;gap:1.6rem}
.pt nav button{background:none;border:0;font-size:.82rem;color:var(--mu);cursor:pointer;padding:.4rem 0;border-bottom:2px solid transparent}
.pt nav button.on{color:var(--hd);font-weight:600;border-bottom-color:var(--tl)}
.hero{background:#2b2f33;color:#fff;text-align:center;padding:4.2rem 1.4rem 4.6rem;position:relative;overflow:hidden}
.hero::after{content:"";position:absolute;inset:0;background:repeating-linear-gradient(115deg,rgba(255,255,255,.025) 0 2px,transparent 2px 22px);pointer-events:none}
.hero h1{font-size:clamp(1.4rem,3.4vw,2.1rem);font-weight:600;letter-spacing:.01em;text-transform:uppercase;position:relative}
.hero p{margin-top:.6rem;font-size:.95rem;opacity:.9;position:relative}
.hero.pub{background:var(--hc,#0d7c73)}
.wrap{max-width:980px;margin:-2.4rem auto 2rem;padding:0 1.2rem;position:relative}
.wrap.flat{margin-top:1.6rem}
.form .cp{padding:1.4rem 1.6rem 1.6rem}
.form h3{font-size:.9rem;font-weight:600;color:var(--hd);margin:1.3rem 0 .1rem;padding-top:1rem;border-top:1px solid var(--bd)}
.form h3:first-child{margin-top:0;padding-top:0;border-top:0}
.req::after{content:" *";color:var(--no)}
.note{background:var(--peb);color:var(--pe);border-radius:6px;padding:.7rem .9rem;font-size:.82rem;margin-bottom:1rem}
.note.ok{background:var(--okb);color:var(--ok)}.note.no{background:var(--nob);color:var(--no)}
.offers{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:1rem}
.of{background:var(--card);border:1px solid var(--bd);border-radius:8px;padding:1rem 1.1rem;display:flex;flex-direction:column;gap:.45rem;box-shadow:var(--sh)}
.of h3{font-size:.95rem;font-weight:600;color:var(--hd);line-height:1.35}
.of .co{font-size:.8rem;color:var(--mu)}
.of .mt{display:flex;flex-wrap:wrap;gap:.35rem}
.of .bt{margin-top:auto;padding-top:.5rem;display:flex;justify-content:space-between;align-items:center;gap:.5rem}
.ftb{display:flex;gap:.6rem;flex-wrap:wrap;margin-bottom:1rem}
.ftb input,.ftb select{width:auto;flex:1 1 180px}
/* ---------- modal / toast ---------- */
.mb{position:fixed;inset:0;background:rgba(10,14,20,.55);display:grid;place-items:center;padding:1rem;z-index:60}
.mc{background:var(--card);border-radius:10px;width:100%;max-width:560px;max-height:90vh;overflow:auto;box-shadow:0 24px 60px rgba(0,0,0,.3)}
.mc.wd{max-width:760px}
.mc .ch{position:sticky;top:0;background:var(--card);z-index:1}
.mf{display:flex;justify-content:flex-end;gap:.5rem;margin-top:1.2rem;flex-wrap:wrap}
#toast{position:fixed;bottom:calc(1rem + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);display:grid;gap:.5rem;z-index:99;width:max-content;max-width:calc(100vw - 2rem)}
.toast{background:#262d36;color:#fff;padding:.6rem 1rem;border-radius:7px;font-size:.84rem;box-shadow:0 6px 18px rgba(0,0,0,.25)}
.toast.e{background:var(--no);color:#fff}
.ld{position:fixed;inset:0;background:var(--bg);display:grid;place-content:center;justify-items:center;gap:1rem;z-index:100;color:var(--mu)}
.spin{width:42px;height:42px;border:4px solid var(--bd);border-top-color:var(--ac);border-radius:50%;animation:s 1s linear infinite}
@keyframes s{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.spin{animation-duration:3s}.xp svg{transition:none}}
@media(max-width:640px){.top{padding:0 .9rem}.uname{display:none}#main{padding:1rem .8rem}.nav{padding:0 .9rem;gap:1.1rem}.ph{padding:.8rem .9rem}}
/* ---------- ajustes de tamaño y legibilidad ---------- */
body{font-size:15px}
label{font-size:.82rem}
input,select,textarea{padding:.62rem .8rem;font-size:.9rem;border-radius:8px}
input:not([type=checkbox]):not([type=color]):not([type=file]):not([type=hidden]),select{min-height:42px}
.btn{padding:.6rem 1.15rem;font-size:.88rem;border-radius:8px;min-height:40px}
.btn.sm{padding:.38rem .8rem;font-size:.8rem;min-height:32px}
.btn.w{min-height:46px}
.ib{width:36px;height:36px;border-radius:8px}
.top{height:64px}
.nav{top:calc(64px + env(safe-area-inset-top,0px))}
.nav button{padding:.95rem 0;font-size:.88rem}
.ph{padding:1.1rem 1.4rem}.ph h1{font-size:1.3rem}
#main{padding:1.6rem 1.4rem 3rem}
th{padding:.85rem 1rem;font-size:.78rem}
td{padding:.85rem 1rem;font-size:.87rem}
.tool{gap:.6rem}
.tool select,.tool input{font-size:.84rem;min-height:40px}
.tool .dr{min-height:40px}.tool .dr input{min-height:0}
.tool .ib{width:40px;height:40px}
.pill{font-size:.8rem;padding:.3rem .7rem}
select.pill{min-height:34px}
.sc{padding:1.15rem 1.25rem}.sc .n{font-size:2.1rem}
.card,.tbw,.sc,.of{border-radius:10px}
.lr{padding:.9rem 1.2rem}.lr .tt{font-size:.84rem}
.box{max-width:440px;padding:2.2rem 2.2rem 1.8rem}
.lk{font-size:.86rem}
.mc{max-width:600px}.mc.wd{max-width:800px}
.pg button{min-width:34px;height:34px}
.uname{font-size:.9rem}.np li{font-size:.84rem}
.toast{font-size:.88rem;padding:.75rem 1.1rem}
.kv{font-size:.86rem}
/* ---------- búsqueda de empleo (alumno) ---------- */
.hero.stu{background:var(--nav)}
.search .cp{padding:1.25rem 1.35rem}
.wrap.wide{max-width:1180px}
.sgrid{display:grid;grid-template-columns:minmax(0,1.5fr) repeat(3,minmax(0,1fr));gap:.9rem}

function paged(list){const n=+F.size||10,pages=Math.max(1,Math.ceil(list.length/n));F.page=Math.min(Math.max(1,F.page||1),pages);const p=F.page,from=(p-1)*n;
 const btns=[];const lo=Math.max(1,p-2),hi=Math.min(pages,lo+4);for(let i=lo;i<=hi;i++)btns.push(`<button data-a="pg" data-id="${i}" class="${i===p?'on':''}" aria-label="Página ${i}">${i}</button>`);
 return{items:list.slice(from,from+n),foot:`<div class="pg"><span>${list.length?(from+1)+'–'+Math.min(from+n,list.length)+' de '+list.length:'No se encontraron registros'}</span><div><button data-a="pg" data-id="1" ${p===1?'disabled':''} aria-label="Primera">«</button><button data-a="pg" data-id="${p-1}" ${p===1?'disabled':''} aria-label="Anterior">‹</button>${btns.join('')}<button data-a="pg" data-id="${p+1}" ${p===pages?'disabled':''} aria-label="Siguiente">›</button><button data-a="pg" data-id="${pages}" ${p===pages?'disabled':''} aria-label="Última">»</button></div></div>`}}

const EXP={};
async function exportCSV(key){const [name,head,rows]=EXP[key]();const csv='\ufeff'+[head,...rows].map(r=>r.map(c=>'"'+String(c??'').replace(/"/g,'""')+'"').join(';')).join('\r\n');const filename=name+'_'+today()+'.csv';
 try{const d=window.claude?.use?await window.claude.use('downloads'):null;if(d){await d.save({filename,data:csv});toast('Archivo exportado');return}}catch(e){if(e&&e.code==='declined')return;}
 try{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv'}));a.download=filename;document.body.append(a);a.click();a.remove();toast('Archivo exportado')}catch(e){toast('No se pudo exportar el archivo en esta vista.',1)}}

const tplReady=u=>!!(u&&(u.phone||'').trim()&&(u.about||'').trim()&&(u.edu||[]).some(e=>(e.inst||'').trim()||(e.prog||'').trim()));
const hasFile=u=>!!(u&&u.cvFile);
const cvReady=u=>tplReady(u)||hasFile(u);
const fill=a=>(a||[]).filter(x=>x&&Object.values(x).some(v=>String(v||'').trim()));
const cvPct=u=>{const c=[u.phone,u.district,u.about,fill(u.edu).length,fill(u.exp).length,fill(u.courses).length,u.skills,fill(u.langs).length];return Math.round(c.filter(x=>x&&String(x).trim()).length/c.length*100)};
function cvDoc(u){const edu=fill(u.edu),exp=fill(u.exp),cur=fill(u.courses),lan=fill(u.langs),sk=(u.skills||'').split(',').map(x=>x.trim()).filter(Boolean),nx='<p class="cvx">Sin completar</p>';
 return `<div class="cvp"><div class="cvh"><div><h2>${esc(full(u))}</h2><p class="cvr">${esc(u.career)}${u.cycle?' · '+(u.cycle==='Egresado'?'Egresado(a)':'Ciclo '+esc(u.cycle)):''}</p></div><div class="cvid">${esc(u.code||'')}<br>${esc(db.cfg.name)}</div></div>
<div class="cvb"><aside><h4>Contacto</h4><p>${esc(u.email)}</p><p>${esc(u.phone)||'<span class="cvx">Teléfono sin completar</span>'}</p>${u.district?`<p>${esc(u.district)}</p>`:''}<p>DNI ${esc(u.dni)}</p>
${sk.length?`<h4>Habilidades</h4><ul class="cvsk">${sk.map(x=>`<li>${esc(x)}</li>`).join('')}</ul>`:''}
${lan.length?`<h4>Idiomas</h4>${lan.map(l=>`<p><b style="font-weight:600">${esc(l.lang)}</b>${l.level?' · '+esc(l.level):''}</p>`).join('')}`:''}
${u.avail||u.shift?`<h4>Disponibilidad</h4>${u.avail?`<p>${esc(u.avail)}</p>`:''}${u.shift?`<p>${esc(u.shift)}</p>`:''}`:''}</aside>
<div class="cvm"><h4>Perfil profesional</h4>${u.about?`<p>${esc(u.about)}</p>`:nx}
<h4>Formación académica</h4>${edu.map(e=>`<div class="cvi"><div class="cvt"><b>${esc(e.prog)}</b><span>${esc(e.from)}${e.to?' – '+esc(e.to):''}</span></div><p>${esc(e.inst)}${e.status?' · '+esc(e.status):''}</p></div>`).join('')||nx}
<h4>Experiencia y prácticas</h4>${exp.map(e=>`<div class="cvi"><div class="cvt"><b>${esc(e.role)}</b><span>${esc(e.from)}${e.to?' – '+esc(e.to):''}</span></div><p>${esc(e.place)}</p>${e.desc?`<p class="cvd">${esc(e.desc)}</p>`:''}</div>`).join('')||nx}
${cur.length?`<h4>Cursos y certificaciones</h4>${cur.map(c=>`<div class="cvi"><div class="cvt"><b>${esc(c.name)}</b><span>${esc(c.year)}</span></div><p>${esc(c.inst)}</p></div>`).join('')}`:''}</div></div>
<div class="cvf">CV generado en la bolsa laboral de ${esc(db.cfg.name)} · Actualizado ${fd(u.mod)}${u.cvFile?' · También subió su CV en archivo':''}</div></div>`}
const cvBtn=id=>`<button class="btn sm g" data-a="cv" data-id="${id}" title="${hasFile(usr(id))?'Plantilla y archivo subido':'Plantilla de CV'}">${ic('file')} Ver CV${hasFile(usr(id))?' '+ic('clip'):''}</button>`;
async function saveFile(filename,data,mime){try{const d=window.claude?.use?await window.claude.use('downloads'):null;if(d){await d.save({filename,data});toast('Archivo descargado');return}}catch(e){if(e&&e.code==='declined')return}
 try{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([data],{type:mime}));a.download=filename;document.body.append(a);a.click();a.remove();toast('Archivo descargado')}catch(e){toast('No se pudo descargar el archivo en esta vista.',1)}}

site:()=>{const s=db.cfg.site;return `<form data-form="cfgSite"><label class="sw"><input type="checkbox" name="public" ${s.public?'checked':''}><span>Publicar el portal de ofertas para alumnos<br><span class="mu">Los alumnos buscan ofertas aprobadas e ingresan con sus mismas credenciales.</span></span></label><label>Título del portal</label><input name="title" value="${esc(s.title)}"><label>Mensaje de bienvenida</label><textarea name="welcome" rows="2">${esc(s.welcome)}</textarea><label>Color de cabecera</label><input type="color" name="color" value="${esc(s.color)}" style="width:80px;height:38px;padding:2px"><div class="mf"><button class="btn g" type="button" data-a="portal" data-id="public">Ver portal de ofertas</button><button class="btn g" type="button" data-a="portal" data-id="company">Ver portal de empresas</button><button class="btn">Guardar micrositio</button></div></form>`},
ga:()=>`<form data-form="cfgGA"><p class="mu">Conecta Google Analytics para medir las visitas al portal de ofertas.</p><label>ID de medición</label><input name="ga" placeholder="G-XXXXXXXXXX" value="${esc(db.cfg.ga)}" pattern="G-[A-Z0-9]{6,12}" title="Formato G-XXXXXXXXXX"><div class="mf"><button class="btn">Guardar</button></div></form>`,
api:()=>{const a=db.cfg.api;return `<p class="mu">Integra la bolsa laboral con otros sistemas del instituto (por ejemplo, el sistema académico).</p><label class="sw"><input type="checkbox" data-a="apiTog" ${a.on?'checked':''}><span>Acceso por API ${a.on?'activado':'desactivado'}</span></label><label>Clave de API</label><div class="code">${esc(a.key)}</div><div class="mf"><button class="btn g" data-a="apiNew">Generar nueva clave</button></div>`}};

/* ===================== ALUMNO ===================== */
V.student.dash=()=>{const mine=db.apps.filter(a=>a.studentId===me.id).sort((a,b)=>b.date.localeCompare(a.date)),last=db.jobs.filter(vis).sort((a,b)=>b.date.localeCompare(a.date)).slice(0,5);
 const miss=db.cfg.rules.needCV&&!cvReady(me)?['CV']:[];
 return `${miss.length?`<div class="note">Completa tu CV en “Mi perfil” (teléfono, perfil profesional y formación) o sube tu CV en archivo para poder postular. <button class="lk" data-a="tab" data-id="perfil">Ir a mi perfil</button></div>`:''}<h2 class="sec">Actividad reciente</h2><div class="sg">${statCard(db.jobs.filter(vis).length,'PUBLICACIONES','Avisos disponibles para postular','mega')}${statCard(db.companies.filter(c=>c.status==='Aprobada').length,'EMPRESAS','Empresas vinculadas a la bolsa','building')}${statCard(mine.length,'MIS POSTULACIONES',mine.filter(a=>['Postulado','En revisión','Entrevista'].includes(a.status)).length+' en proceso','users')}</div>
<div class="ch" style="border:0;padding:0 0 .7rem"><h2 class="sec" style="margin:0">Últimas publicaciones</h2><button class="lk" data-a="tab" data-id="avisos">Ver todas</button></div>
<div class="card">${last.map(j=>{const c=co(j.companyId);return `<div class="lr">${logo(c)}<div class="tt">${esc(c.name)} – ${esc(j.title)} – ${esc(city(j))}<small>${esc(j.career)} · Publicado ${fd(j.date)}</small></div><div class="ac">${ibtn('eye','jview',j.id,'Ver aviso')}${stuApplied(j.id)?pill('Postulado'):`<button class="btn sm" data-a="apply" data-id="${j.id}">Postular</button>`}</div></div>`}).join('')||'<div class="em">Aún no hay publicaciones</div>'}</div>
<div class="ch" style="border:0;padding:0 0 .7rem"><h2 class="sec" style="margin:0">Mis postulaciones recientes</h2><button class="lk" data-a="tab" data-id="postulaciones">Ver todas</button></div>
<div class="tbw"><div class="cb"><table><thead><tr><th>Aviso</th><th>Empresa</th><th>Fecha</th><th>Estado</th></tr></thead><tbody>${mine.slice(0,5).map(a=>{const j=job(a.jobId);return `<tr><td>${esc(j?.title)}</td><td>${esc(co(j?.companyId)?.name)}</td><td class="nw">${fd(a.date)}</td><td>${pill(a.status)}</td></tr>`}).join('')||'<tr><td colspan="4" class="em">Aún no postulas. Revisa los avisos disponibles.</td></tr>'}</tbody></table></div></div>`};

V.student.empresas=()=>toolbar({dates:false,sel:fsel('sec',[...new Set(db.companies.filter(c=>c.status==='Aprobada').map(c=>c.sector))].sort(),'Filtrar por rubro')})+table(()=>{const{items,foot}=paged(db.companies.filter(c=>c.status==='Aprobada'&&hit(c.name+' '+c.city)&&(!F.sec||c.sector===F.sec)).sort((a,b)=>a.name.localeCompare(b.name)));
 return `<div class="cb"><table><thead><tr><th>Empresa</th><th>Rubro</th><th>Ubicación</th><th>Avisos disponibles</th></tr></thead><tbody>${items.map(c=>`<tr><td style="display:flex;gap:.7rem;align-items:center">${logo(c)}<span style="font-weight:500">${esc(c.name)}</span></td><td>${esc(c.sector)}</td><td>${esc(c.city)}, ${esc(c.country)}</td><td>${db.jobs.filter(j=>j.companyId===c.id&&vis(j)).length}</td></tr>`).join('')||'<tr><td colspan="4" class="em">No hay datos disponibles</td></tr>'}</tbody></table></div>${foot}`});

const TYPES=['Empleo','Prácticas pre-profesionales','Prácticas profesionales'];
const SORTS={rec:['Más recientes',(a,b)=>b.date.localeCompare(a.date)],sal:['Mayor remuneración',(a,b)=>(+b.salary||0)-(+a.salary||0)],cie:['Cierre más próximo',(a,b)=>(a.deadline||'').localeCompare(b.deadline||'')]};
const stuJobs=()=>db.jobs.filter(j=>vis(j)&&hit(j.title+' '+co(j.companyId).name+' '+j.desc+' '+j.place+' '+j.career)&&(!F.typ||j.type===F.typ)&&(!F.cty||city(j)===F.cty)&&(!F.car||j.career===F.car)&&(!F.mine||!stuApplied(j.id))).sort((SORTS[F.sort]||SORTS.rec)[1]);
const daysLeft=d=>Math.round((new Date(d+'T00:00')-new Date(today()+'T00:00'))/864e5);
const jobCard=j=>{const c=co(j.companyId),n=daysLeft(j.deadline);
 return `<article class="of"><div class="oh">${logo(c)}<div><h3>${esc(j.title)}</h3><div class="co">${esc(c.name)}</div></div></div>
<div class="mt"><span class="tag t1">${esc(j.type)}</span><span class="tag">${esc(j.career)}</span><span class="tag">${esc(j.mode)}</span></div>
<div class="meta"><span>${ic('pin')} ${esc(j.place)}</span><span class="${n<0?'late':''}">${ic('cal')} ${n<0?'Plazo vencido':n===0?'Cierra hoy':'Cierra en '+n+(n===1?' día':' días')}</span><span>${ic('users')} ${esc(j.vacancies)} ${+j.vacancies===1?'vacante':'vacantes'}</span></div>
<div class="bt"><b>${money(j.salary)}</b><div style="display:flex;gap:.45rem"><button class="btn sm g" data-a="jview" data-id="${j.id}">Ver detalle</button>${stuApplied(j.id)?pill('Postulado'):`<button class="btn sm" data-a="apply" data-id="${j.id}">Postular</button>`}</div></div></article>`};
V.student.avisos=()=>{const cities=[...new Set(db.jobs.filter(vis).map(city))].sort();
 return `<section class="hero stu"><h1>Hola, ${esc(me.first)}</h1><p>Estas son las ofertas aprobadas por la bolsa laboral. Busca por tipo de empleo y ubicación, y postula desde aquí.</p></section>
<div class="wrap wide"><div class="card search"><div class="cp"><div class="sgrid">
<div class="sf k"><label for="sq">Puesto o palabra clave</label><div class="iw">${ic('search')}<input id="sq" data-f="q" placeholder="Enfermería, farmacia, laboratorio…" value="${esc(F.q||'')}" autocomplete="off"></div></div>
<div class="sf"><label for="st">Tipo de empleo</label><select id="st" data-f="typ">${opt(TYPES,F.typ,'Todos')}</select></div>
<div class="sf"><label for="sc">Ubicación</label><select id="sc" data-f="cty">${opt(cities,F.cty,'Todas')}</select></div>
<div class="sf"><label for="sr">Carrera</label><select id="sr" data-f="car">${opt(db.cfg.careers,F.car,'Todas')}</select></div></div>
<div class="chiprow">${['',...TYPES].map(t=>`<button class="qchip ${(F.typ||'')===t?'on':''}" data-a="qtyp" data-id="${esc(t)}" aria-pressed="${(F.typ||'')===t}">${t||'Todas las ofertas'}</button>`).join('')}<button class="qchip ${F.car===me.career?'on':''}" data-a="qcar" aria-pressed="${F.car===me.career}">Solo mi carrera</button><span class="sp"></span><button class="lk" data-a="clearF">Limpiar filtros</button></div></div></div>
<div id="tw">${stuResults()}</div></div>`};
function stuResults(){curT=stuResults;const l=stuJobs();
 return `<div class="rh"><span><b>${l.length}</b> ${l.length===1?'oferta encontrada':'ofertas encontradas'}</span><label class="sw"><input type="checkbox" data-a="togMine" ${F.mine?'checked':''}> Ocultar las que ya postulé</label><select data-f="sort" aria-label="Ordenar">${Object.entries(SORTS).map(([k,v])=>`<option value="${k}" ${(F.sort||'rec')===k?'selected':''}>${v[0]}</option>`).join('')}</select></div>
${l.length?`<div class="offers">${l.map(jobCard).join('')}</div>`:`<div class="card"><div class="cp em">No hay ofertas con esos filtros. Prueba con otra ubicación o tipo de empleo.<br><button class="btn g" style="margin-top:.9rem" data-a="clearF">Limpiar filtros</button></div></div>`}`}

V.student.postulaciones=()=>toolbar({sel:fsel('est',ST.app,'Filtrar por estado')})+table(()=>{const{items,foot}=paged(db.apps.filter(a=>a.studentId===me.id&&inRange(a.date)&&(!F.est||a.status===F.est)&&hit(job(a.jobId)?.title+' '+co(job(a.jobId)?.companyId)?.name)).sort((a,b)=>b.date.localeCompare(a.date)));
 return `<div class="cb"><table><thead><tr><th>Aviso</th><th>Empresa</th><th>Fecha</th><th>Última actualización</th><th>Estado</th><th>Acción</th></tr></thead><tbody>${items.map(a=>{const j=job(a.jobId);return `<tr><td style="font-weight:500">${esc(j?.title)}</td><td>${esc(co(j?.companyId)?.name)}</td><td class="nw">${fd(a.date)}</td><td class="nw">${fdt(a.mod)}</td><td>${pill(a.status)}</td><td class="nw">${ibtn('eye','jview',j?.id,'Ver aviso')} ${a.status==='Postulado'?`<button class="btn sm g" data-a="retire" data-id="${a.id}">Retirar</button>`:''}</td></tr>`}).join('')||'<tr><td colspan="6" class="em">No se encontraron registros</td></tr>'}</tbody></table></div>${foot}`});

const PROF_LISTS={edu:[['inst','Institución',3],['prog','Carrera o nivel',3],['from','Desde',1,'2024'],['to','Hasta',1,'2026'],['status','Estado',4,'Cursando 6.º ciclo']],
 exp:[['place','Centro de prácticas o empresa',3],['role','Puesto o área',3,'Practicante de Enfermería – Tópico'],['from','Desde',1,'Mar 2026'],['to','Hasta',1,'Jul 2026'],['desc','Funciones realizadas',4,'',1]],
 courses:[['name','Curso o certificación',3],['inst','Institución',2],['year','Año',1,'2025']],
 langs:[['lang','Idioma',3,'Inglés'],['level','Nivel',3,'',0,['Básico','Intermedio','Avanzado','Nativo']]]};
function applyProfile(form){const fd=new FormData(form),d={};for(const[k,v]of fd.entries())d[k]=v;
 ['first','last','phone','career','cycle','about','district','avail','shift','skills'].forEach(k=>{if(d[k]!==undefined)me[k]=String(d[k]).trim()});
 Object.keys(PROF_LISTS).forEach(sec=>{const out=[];Object.keys(d).forEach(k=>{const m=k.match(new RegExp('^'+sec+'-(\\d+)-(\\w+)$'));if(m){(out[+m[1]]??={})[m[2]]=String(d[k]).trim()}});me[sec]=Array.from(out,x=>x||{})});
 return d}
const rowsOf=sec=>`<div data-sec="${sec}">${(me[sec]||[]).map((r,i)=>`<div class="rr">${PROF_LISTS[sec].map(([k,l,w,ph,ta,sel])=>`<div style="grid-column:span ${w}"><label for="${sec}-${i}-${k}">${l}</label>${ta?`<textarea id="${sec}-${i}-${k}" name="${sec}-${i}-${k}" rows="2" placeholder="${esc(ph||'')}">${esc(r[k])}</textarea>`:sel?`<select id="${sec}-${i}-${k}" name="${sec}-${i}-${k}">${sel.map(o=>`<option ${o===r[k]?'selected':''}>${o}</option>`).join('')}</select>`:`<input id="${sec}-${i}-${k}" name="${sec}-${i}-${k}" value="${esc(r[k])}" placeholder="${esc(ph||'')}">`}</div>`).join('')}<button type="button" class="ib rrx" data-a="rmRow" data-id="${sec}:${i}" title="Quitar" aria-label="Quitar esta fila">${ic('x')}</button></div>`).join('')||'<p class="mu" style="margin:.5rem 0">Aún no agregas registros.</p>'}</div>`;
const addBtn=(sec,t)=>`<button type="button" class="btn sm g addr" data-a="addRow" data-id="${sec}">+ ${t}</button>`;
V.student.perfil=()=>{const pc=cvPct(me),ok=cvReady(me);
 return `<div class="card" style="max-width:920px"><div class="cp pf-top"><div style="flex:1;min-width:220px"><div style="display:flex;justify-content:space-between;font-size:.86rem;margin-bottom:.4rem"><span style="color:var(--hd);font-weight:500">Tu CV está ${pc}% completo</span>${ok?pill('Listo para postular'):pill('Pendiente')}</div><div class="prog"><b style="width:${pc}%"></b></div><p class="mu" style="margin-top:.45rem">${hasFile(me)?'Tienes un CV en archivo subido. ':''}La bolsa laboral y las empresas a las que postules verán tu CV con estos datos${hasFile(me)?' y tu archivo':''}.</p></div><button class="btn g" data-a="cvPreview">${ic('eye')} Vista previa de mi CV</button></div></div>
<div class="card form" style="max-width:920px"><div class="cp"><form data-form="profile">
<h3>Datos personales</h3><div class="g2"><div><label class="req">Nombres</label><input name="first" required value="${esc(me.first)}"></div><div><label class="req">Apellidos</label><input name="last" required value="${esc(me.last)}"></div><div><label>Identificador</label><input disabled value="${esc(me.code)}"></div><div><label>DNI</label><input disabled value="${esc(me.dni)}"></div><div><label>Correo</label><input disabled value="${esc(me.email)}"></div><div><label class="req">Teléfono</label><input name="phone" value="${esc(me.phone)}" placeholder="987 654 321"></div><div><label>Distrito de residencia</label><input name="district" value="${esc(me.district)}" placeholder="San Juan de Miraflores, Lima"></div><div class="g2" style="gap:0 .9rem"><div><label class="req">Carrera</label><select name="career">${db.cfg.careers.map(c=>`<option ${c===me.career?'selected':''}>${esc(c)}</option>`).join('')}</select></div><div><label>Ciclo</label><select name="cycle">${['1','2','3','4','5','6','Egresado'].map(c=>`<option ${c===me.cycle?'selected':''}>${c}</option>`).join('')}</select></div></div></div>
<h3>Perfil profesional</h3><label class="req" for="about">Preséntate en 2 o 3 líneas</label><textarea id="about" name="about" rows="3" placeholder="Estudiante de Enfermería Técnica con prácticas en tópico…">${esc(me.about)}</textarea>
<h3>Formación académica</h3>${rowsOf('edu')}${addBtn('edu','Agregar formación')}
<h3>Experiencia y prácticas</h3>${rowsOf('exp')}${addBtn('exp','Agregar experiencia')}
<h3>Cursos y certificaciones</h3>${rowsOf('courses')}${addBtn('courses','Agregar curso')}
<h3>Habilidades e idiomas</h3><label for="skills">Habilidades (separadas por comas)</label><input id="skills" name="skills" value="${esc(me.skills)}" placeholder="Control de funciones vitales, Curaciones, Bioseguridad">${rowsOf('langs')}${addBtn('langs','Agregar idioma')}
<h3>Disponibilidad</h3><div class="g2"><div><label>Inicio</label><select name="avail">${['Inmediata','En 15 días','En 30 días','Al terminar el ciclo'].map(o=>`<option ${o===me.avail?'selected':''}>${o}</option>`).join('')}</select></div><div><label>Horario</label><select name="shift">${['Mañana','Tarde','Noche','Turnos rotativos','Fines de semana'].map(o=>`<option ${o===me.shift?'selected':''}>${o}</option>`).join('')}</select></div></div>
<h3>CV en archivo (opcional)</h3><p class="mu">Además de la plantilla, puedes subir tu propio CV. Si lo haces, la bolsa laboral y las empresas a las que postules podrán verlo y descargarlo. Con el archivo subido ya puedes postular aunque la plantilla esté incompleta.</p>
${me.cvFile?`<div class="fcard">${ic('clip')}<div style="flex:1;min-width:180px"><b style="font-weight:500;color:var(--hd);word-break:break-all">${esc(me.cvFile.name)}</b><br><span class="mu">${kb(me.cvFile.size)} · subido el ${fdt(me.cvFile.date)}</span></div><button type="button" class="btn sm g" data-a="cvTab" data-id="${me.id}:file">Ver</button><label class="btn sm g" style="margin:0;cursor:pointer;color:var(--tx)">Reemplazar<input type="file" class="hidden" data-up="cvfile" accept=".pdf,.docx,.jpg,.jpeg,.png"></label><button type="button" class="btn sm no" data-a="cvRm">Quitar</button></div>`:`<label class="drop">${ic('upload')}<span><b style="font-weight:500;color:var(--hd)">Subir mi CV</b><br><span class="mu">PDF, Word (.docx) o imagen JPG/PNG · máximo 1.5 MB</span></span><input type="file" class="hidden" data-up="cvfile" accept=".pdf,.docx,.jpg,.jpeg,.png"></label>`}
<h3>Seguridad</h3><div class="g2"><div><label>Nueva contraseña (opcional)</label><input type="password" name="password" minlength="6" autocomplete="new-password"></div></div>
<div class="mf"><button type="button" class="btn g" data-a="cvPreview">${ic('eye')} Vista previa</button><button class="btn">Guardar perfil</button></div></form></div></div>`};

V.company.alta=()=>jobForm({});
function jobForm(j,adm){const edit=!!j.id;return `<div class="card form"><div class="cp"><form data-form="${adm?'jobAdmin':'jobSave'}">${edit?`<input type="hidden" name="id" value="${j.id}">`:''}<h3>Datos del puesto</h3><label class="req">Nombre del puesto</label><input name="title" required maxlength="90" placeholder="Ej.: Técnico(a) en Enfermería – Hospitalización" value="${esc(j.title)}"><div class="g3"><div><label class="req">Carrera</label><select name="career" required>${db.cfg.careers.map(c=>`<option ${c===j.career?'selected':''}>${esc(c)}</option>`).join('')}</select></div><div><label class="req">Tipo</label><select name="type">${['Empleo','Prácticas pre-profesionales','Prácticas profesionales'].map(c=>`<option ${c===j.type?'selected':''}>${c}</option>`).join('')}</select></div><div><label class="req">Modalidad</label><select name="mode">${['Presencial','Híbrido','Remoto'].map(c=>`<option ${c===j.mode?'selected':''}>${c}</option>`).join('')}</select></div></div>
<div class="g4"><div style="grid-column:span 2"><label class="req">Lugar (distrito, ciudad)</label><input name="place" required placeholder="Miraflores, Lima" value="${esc(j.place)}"></div><div><label class="req">Vacantes</label><input type="number" name="vacancies" min="1" required value="${esc(j.vacancies||1)}"></div><div><label>Remuneración (S/)</label><input type="number" name="salary" min="0" placeholder="0 = a tratar" value="${esc(j.salary||'')}"></div></div>
<div class="g4"><div><label class="req">Fecha límite</label><input type="date" name="deadline" required ${adm?'':`min="${today()}"`} value="${esc(j.deadline)}"></div></div>
<h3>Descripción</h3><label class="req">Funciones</label><textarea name="desc" rows="4" required>${esc(j.desc)}</textarea><label>Requisitos</label><textarea name="reqs" rows="3">${esc(j.reqs)}</textarea><label>Beneficios</label><textarea name="perks" rows="2">${esc(j.perks)}</textarea>
<div class="mf">${edit?`<button type="button" class="btn g" data-a="close">Cancelar</button>`:''}<button class="btn ${adm?'':'tl'}">${adm?'Guardar cambios':ic('send')+' '+(edit?'Reenviar solicitud':'Enviar solicitud de publicación')}</button></div></form></div></div>`}

V.company.gestor=()=>{const js=db.jobs.filter(j=>j.companyId===me.companyId),ap=db.apps.filter(a=>js.some(j=>j.id===a.jobId));
 return `<div class="sg">${statCard(js.filter(vis).length,'AVISOS PUBLICADOS','Visibles para los alumnos','mega')}${statCard(js.filter(j=>j.status==='Pendiente').length,'EN REVISIÓN','Esperando aprobación','file')}${statCard(ap.length,'POSTULACIONES','Total recibidas en tus avisos','users')}${statCard(ap.filter(a=>a.status==='Postulado').length,'NUEVAS','Aún sin revisar','bell')}</div>

/* ---------- cambios de estado ---------- */
function setStatus(k,id,v,note){
 if(k==='co'){const c=co(id);c.status=v;c.mod=now();if(note!==undefined)c.note=note;toast('Empresa '+v.toLowerCase())}
 if(k==='job'){const j=job(id);j.status=v;j.mod=now();if(note!==undefined)j.note=note;toast(v==='Aprobada'&&co(j.companyId).status!=='Aprobada'?'Aviso aprobado. Será visible cuando apruebes la empresa.':'Aviso: '+v.toLowerCase())}
 if(k==='app'){const a=db.apps.find(x=>x.id===+id);a.status=v;a.mod=now();toast('Postulación: '+v.toLowerCase())}
 save();close();draw()}
function askReject(k,id,v){const o=k==='co'?co(id):job(id);modal('Rechazar '+(k==='co'?'empresa':'aviso'),`<p><b style="font-weight:500">${esc(o.name||o.title)}</b></p><label>Motivo (lo verá la empresa)</label><textarea id="why" rows="3" placeholder="Ej.: Falta indicar horario y remuneración">${esc(o.note||'')}</textarea><div class="mf"><button class="btn g" data-a="close">Cancelar</button><button class="btn no" data-a="doReject" data-id="${id}" data-k="${k}" data-v="${v}">Rechazar</button></div>`)}

 resetAsk:()=>modal('Restablecer datos de prueba',`<p>Se borrarán las empresas, avisos, postulaciones y alumnos creados durante las pruebas, y se cargarán los datos de ejemplo. Las sesiones abiertas se mantienen.</p><div class="mf"><button class="btn g" data-a="close">Cancelar</button><button class="btn no" data-a="resetData">Restablecer datos</button></div>`),
 resetData:()=>{try{Object.keys(localStorage).filter(k=>k.startsWith(CVPRE)).forEach(k=>localStorage.removeItem(k))}catch(e){}db=normalize(seed());save();close();if(me)me=usr(me.id);if(!me)ss.del(SK);F={};OPEN.clear();tab=me?.role==='company'?'alta':'dash';draw();toast('Datos de prueba restablecidos')},
 safeHome:()=>{F={};OPEN.clear();bellOpen=false;tab=me?.role==='company'?'alta':'dash';close();draw()}
};
function pubLoginModal(){const id=arguments[0];pendingJob=id?+id:null;modal('Ingresar con mi cuenta de alumno',`<p class="mu">Usa el mismo correo y contraseña del campus. Te llevaremos a tu cuenta${pendingJob?' con el aviso listo para postular':''}.</p><form data-form="pubLogin"><label>Correo electrónico</label><input type="email" name="email" required autocomplete="username"><label>Contraseña</label><input type="password" name="password" required autocomplete="current-password"><p id="err" class="err hidden" role="alert"></p><button class="btn w tl">Ingresar</button></form>`)}
A.pubLogin=id=>pubLoginModal(id);
function toAccount(){portal='campus';try{history.replaceState(null,'','#campus')}catch(e){}tab='dash';F={};if(pendingJob){tab='avisos';const j=pendingJob;pendingJob=null;draw();A.jview(j)}else draw();window.scrollTo(0,0)}

/* ---------- formularios ---------- */
const FM={
 login:d=>{const[u,m]=login(d.email,d.password);if(!u)return err(m);if(u.role==='company')return err('Esta es una cuenta de empresa. Ingresa por el portal de empresas.');withLoad(()=>enter(u))},
 loginCo:d=>{const[u,m]=login(d.email,d.password);if(!u)return err(m);if(u.role!=='company')return err('Esta cuenta no es de empresa. Ingresa por el portal de alumnos y administración.');withLoad(()=>enter(u))},
 pubLogin:d=>{const[u,m]=login(d.email,d.password);if(!u)return err(m);if(u.role!=='student')return err('Este acceso es solo para alumnos.');close();me=u;ss.set(SK,String(u.id));withLoad(toAccount)},
 regStu:d=>{const em=d.email.trim().toLowerCase();if(db.users.some(u=>u.email===em))return err('Ese correo ya está registrado.');if(db.users.some(u=>u.dni===d.dni))return err('Ese DNI ya está registrado.');
  const n=db.users.filter(u=>u.role==='student').length+1,u={id:nid(db.users),role:'student',first:d.first.trim(),last:d.last.trim(),code:'SCL-'+new Date().getFullYear()+'-'+String(n).padStart(3,'0'),dni:d.dni,email:em,password:d.password,career:d.career,cycle:d.cycle,phone:'',cv:'',about:'',status:'Activo',date:today(),mod:now()};
  db.users.push(u);save();regMode=false;enter(u);toast('Cuenta creada. Completa tu perfil y carga tu CV para postular.')},
 regCo:d=>{const em=d.email.trim().toLowerCase();if(db.users.some(u=>u.email===em))return err('Ese correo ya está registrado.');if(db.companies.some(c=>c.ruc===d.ruc))return err('Ya existe una empresa con ese RUC.');
  const auto=db.cfg.rules.autoCompany,c={id:nid(db.companies),name:d.name.trim(),ruc:d.ruc,sector:d.sector,country:d.country,city:d.city.trim(),address:'',contact:d.contact.trim(),phone:d.phone.trim(),email:em,web:'',status:auto?'Aprobada':'Pendiente',date:today(),mod:now(),note:''};
  db.companies.push(c);const u={id:nid(db.users),role:'company',email:em,password:d.password,companyId:c.id};db.users.push(u);
  notify(`Nueva empresa registrada: <b>${esc(c.name)}</b>${auto?'':' (pendiente de aprobación)'}`,['empresas',c.id]);save();regMode=false;enter(u);toast(auto?'Empresa registrada.':'Empresa registrada. Queda pendiente de aprobación.')},
 jobSave:d=>{const c=co(me.companyId),f={title:d.title.trim(),career:d.career,type:d.type,mode:d.mode,place:d.place.trim(),vacancies:+d.vacancies||1,salary:+d.salary||0,deadline:d.deadline,desc:d.desc.trim(),reqs:d.reqs.trim(),perks:d.perks.trim()};let j;
  if(d.id){j=job(d.id);Object.assign(j,f,{status:'Pendiente',mod:now(),date:now(),note:''})}else{j={id:nid(db.jobs),companyId:c.id,...f,status:'Pendiente',views:0,date:now(),mod:now(),note:''};db.jobs.push(j)}
  notify(`<b>${esc(c.name)}</b> ha solicitado la publicación del aviso [${esc(j.title)} – ${esc(city(j))}]`,['avisos',j.id]);save();close();tab='gestor';F={};OPEN.clear();draw();window.scrollTo(0,0);toast('Solicitud enviada. La bolsa laboral revisará tu aviso.')},
 jobAdmin:d=>{const j=job(d.id);Object.assign(j,{title:d.title.trim(),career:d.career,type:d.type,mode:d.mode,place:d.place.trim(),vacancies:+d.vacancies||1,salary:+d.salary||0,deadline:d.deadline,desc:d.desc.trim(),reqs:d.reqs.trim(),perks:d.perks.trim(),mod:now()});save();close();draw();toast('Aviso actualizado')},
 coSave:d=>{const c=co(me.companyId),wasRej=c.status==='Rechazada';Object.assign(c,{name:d.name.trim(),ruc:d.ruc.trim(),sector:d.sector,country:d.country,city:d.city.trim(),address:d.address.trim(),contact:d.contact.trim(),phone:d.phone.trim(),mod:now()});
  if(wasRej){c.status='Pendiente';notify(`<b>${esc(c.name)}</b> actualizó sus datos y solicita una nueva revisión`,['empresas',c.id])}save();draw();toast(wasRej?'Datos enviados a revisión':'Datos guardados')},
 profile:(d,f)=>{applyProfile(f);Object.keys(PROF_LISTS).forEach(k=>me[k]=fill(me[k]));if(d.password){if(d.password.length<6)return toast('La contraseña debe tener al menos 6 caracteres.',1);me.password=d.password}me.mod=now();save();draw();toast('Perfil guardado')},
 stuAdmin:d=>{const u=usr(d.id);Object.assign(u,{first:d.first.trim(),last:d.last.trim(),code:d.code.trim(),dni:d.dni.trim(),career:d.career,status:d.status,mod:now()});save();close();draw();toast('Alumno actualizado')},
 cfgInfo:d=>{Object.assign(db.cfg,{name:d.name.trim(),legal:d.legal.trim(),email1:d.email1.trim(),email2:d.email2.trim(),phone1:d.phone1.trim(),phone2:d.phone2.trim(),phone3:d.phone3.trim(),ruc:d.ruc.trim(),address:d.address.trim(),web:d.web.trim(),desc:d.desc.trim(),mod:now()});save();draw();toast('Cambios guardados')},
 cfgRules:d=>{db.cfg.rules={needCV:!!d.needCV,notifyApps:!!d.notifyApps,autoCompany:!!d.autoCompany};db.cfg.mod=now();save();draw();toast('Configuración guardada')},
 addCar:d=>{const k=d.car.trim();if(db.cfg.careers.some(c=>c.toLowerCase()===k.toLowerCase()))return toast('Esa carrera ya está habilitada.',1);db.cfg.careers.push(k);save();draw();toast('Carrera agregada')},
 cfgSite:d=>{db.cfg.site={public:!!d.public,title:d.title.trim()||'Bolsa Laboral',welcome:d.welcome.trim(),color:d.color};db.cfg.mod=now();save();draw();toast('Micrositio guardado')},
 cfgGA:d=>{db.cfg.ga=d.ga.trim();save();draw();toast('ID de Google Analytics guardado')}
};

/* ---------- eventos ---------- */
document.addEventListener('click',e=>{
 const b=e.target.closest('[data-a]');
 if(bellOpen&&!e.target.closest('.bell')){bellOpen=false;if(!b||!A[b.dataset.a]){draw();return}}
 if(!b||!A[b.dataset.a])return;
 if(b.tagName==='INPUT'&&b.type==='checkbox'){A[b.dataset.a](b.dataset.id,e);return}
 if(b.dataset.a==='bd'&&!e.target.classList.contains('mb'))return;
 A[b.dataset.a](b.dataset.id,e)});
document.addEventListener('submit',e=>{const k=e.target.dataset.form;if(!k||!FM[k])return;e.preventDefault();const fd=new FormData(e.target),d={};for(const[key,v]of fd.entries())d[key]=v;FM[k](d,e.target)});
document.addEventListener('input',e=>{const k=e.target.dataset?.f;if(!k||e.target.tagName==='SELECT')return;F[k]=e.target.value;F.page=1;refresh()});
document.addEventListener('change',e=>{const t=e.target;
 if(t.dataset?.f&&t.tagName==='SELECT'){F[t.dataset.f]=t.value;F.page=1;refresh();return}
 if(t.dataset?.f&&t.type==='date'){F[t.dataset.f]=t.value;F.page=1;refresh();return}
 if(t.dataset?.ch){const k=t.dataset.ch,id=t.dataset.id,v=t.value;if(v==='Rechazada'&&(k==='co'||k==='job')){askReject(k,id,v);t.value=(k==='co'?co(id):job(id)).status;t.className='pill '+CL[t.value]}else setStatus(k,id,v);return}
 if(t.dataset?.up==='cvfile'&&t.files[0]){const f=t.files[0];t.value='';
  if(!/\.(pdf|docx|jpe?g|png)$/i.test(f.name))return toast('Sube un archivo PDF, Word (.docx) o imagen JPG/PNG.',1);
  if(f.size>1.5*1048576)return toast('El archivo pesa '+kb(f.size)+'. El máximo es 1.5 MB.',1);
  const r=new FileReader();r.onerror=()=>toast('No se pudo leer el archivo.',1);
  r.onload=()=>{const fm=$('form[data-form=profile]');if(fm)applyProfile(fm);const rec={name:f.name,type:f.type||'',size:f.size,date:now(),data:r.result};
   try{localStorage.setItem(cvKey(me.id),JSON.stringify(rec))}catch(e){return toast('No hay espacio en este navegador para guardar el archivo. Prueba con uno más liviano.',1)}
   me.cvFile={name:rec.name,type:rec.type,size:rec.size,date:rec.date};me.mod=now();save();draw();toast('CV subido')};
  r.readAsDataURL(f);return}
 if(t.dataset?.up==='logo'&&t.files[0]){const f=t.files[0];if(f.size>600000)return toast('El logo debe pesar menos de 600 KB.',1);const r=new FileReader();r.onload=()=>{db.cfg.logo=r.result;db.cfg.mod=now();save();draw();toast('Logo actualizado')};r.readAsDataURL(f)}});
document.addEventListener('keydown',e=>{if(e.key==='Escape'){if($('#modal').innerHTML)close();else if(bellOpen){bellOpen=false;draw()}}});
window.addEventListener('storage',e=>{if(e.key!==KEY||!e.newValue)return;try{db=normalize(JSON.parse(e.newValue))}catch(x){return}
 if(me){me=usr(me.id)||null;if(!me)ss.del(SK)}
 const a=document.activeElement;if($('#modal').innerHTML||(a&&a.closest&&a.closest('form')&&/INPUT|TEXTAREA|SELECT/.test(a.tagName)))return toast('Hay cambios nuevos de otro usuario; se verán al continuar.');
 draw()});
window.addEventListener('hashchange',()=>{route();me=session();F={};tab=me&&me.role==='company'?'alta':'dash';draw()});

/* ---------- arranque ---------- */
route(true);
me=session();if(me){const t=ss.get('scl_tab');tab=t&&V[me.role][t]?t:(me.role==='company'?'alta':'dash');try{F=JSON.parse(ss.get('scl_F'))||{}}catch(e){F={}}}
draw();
</script>
</body>
